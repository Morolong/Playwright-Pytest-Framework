name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: pytest (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve Playwright version
        id: pw
        run: |
          echo "version=$(python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}

      - name: Install Playwright browser and OS dependencies
        run: |
          python -m playwright install --with-deps chromium

      - name: Run tests
        run: |
          python -m pytest \
            --video=retain-on-failure

      - name: Upload test reports (HTML + JUnit XML)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-reports-${{ github.run_number }}
          path: reports/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload failure evidence (screenshots, traces, videos)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: failure-evidence-${{ github.run_number }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Summarise result
        if: always()
        run: |
          {
            echo "### Playwright test run"
            echo ""
            echo "- Base URL: \`https://parabank.parasoft.com/parabank/index.htm\`"
            echo "- Artifacts: **test-reports-${{ github.run_number }}** (HTML + JUnit)"
            echo "- Failure evidence: **failure-evidence-${{ github.run_number }}**"
            echo ""
            echo "Open a trace with: \`playwright show-trace <path-to-trace.zip>\`"
          } >> "$GITHUB_STEP_SUMMARY"